name: festival-alert-kr

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: festival-alert-kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: 실행 (scan · 한국 러너 담당 사이트)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ALERT_CHAT_IDS }}
          TELEGRAM_ADMIN_CHAT_IDS: ${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SCAN_RUNNER: kr
          SKIP_INBOX: "1"
          SCRAPER_DEBUG_DIR: debug
        run: python main.py scan

      - name: 데이터 파일 커밋 · 푸시
        if: always()
        run: |
          git config user.name "festival-alert-bot"
          git config user.email "festival-alert-bot@users.noreply.github.com"
          git checkout -- bot_state.json 2>$null
          $files = @("festival_sites.json", "known_posts.json", "feedback.json")
          foreach ($f in $files) {
            if (Test-Path $f) { git add $f }
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "변경된 데이터 없음"
            exit 0
          }
          git commit -m "data: scan-kr $((Get-Date).ToString('yyyy-MM-dd HH:mm KST')) [skip ci]"
          for ($i = 1; $i -le 3; $i++) {
            git rebase --abort 2>$null
            git pull --rebase --autostash -X theirs origin $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -eq 0) {
              git push origin "HEAD:$env:GITHUB_REF_NAME"
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            Write-Host "push 실패 — 재시도 $i"
            Start-Sleep -Seconds 10
          }
          exit 1






































































