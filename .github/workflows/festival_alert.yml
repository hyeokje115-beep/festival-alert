name: festival-alert

on:
  schedule:
    # GitHub cron은 UTC 기준 → KST 09:00 = UTC 00:00, KST 18:00 = UTC 09:00
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # known_posts.json 커밋에 필요

concurrency:
  group: festival-alert
  cancel-in-progress: false # 이전 실행이 안 끝났으면 겹치지 않게 대기

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 공모 확인 실행
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
          PYTHONUNBUFFERED: "1"
        run: python festival_checker.py

      - name: known_posts.json 커밋
        if: always()          # 스크립트가 중간에 실패해도 그때까지 저장된 DB는 반영
        run: |
          git config user.name "festival-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add known_posts.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: known_posts 갱신 $(date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
