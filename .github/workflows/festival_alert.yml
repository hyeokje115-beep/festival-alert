name: Festival Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # KST 09:00 (UTC 00:00)
    - cron: '0 9 * * *'   # KST 18:00 (UTC 09:00)

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install playwright requests google-generativeai
          playwright install chromium
          playwright install-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC:     ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python festival_checker.py

      - name: Commit updated known_posts.json
        run: |
          git config user.name  "festival-bot"
          git config user.email "bot@example.com"
          git add known_posts.json
          git diff --staged --quiet || git commit -m "update known_posts [skip ci]"
          git push
