name: festival-alert


on:
  schedule:
    - cron: "0 0,9 * * *"     # KST 09:00 · 18:00 → scan
    - cron: "30 4 * * *"      # KST 13:30 → scan
    - cron: "*/15 * * * *"    # 15분마다 → inbox
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (scan: 스캔+알림 / inbox: 명령·피드백만 / check: 설정 점검)"
        type: choice
        default: scan
        options:
          - scan
          - inbox
          - check


permissions:
  contents: write


concurrency:
  group: festival-alert          # scan 과 inbox 가 겹쳐 JSON 커밋이 충돌하지 않도록 직렬화
  cancel-in-progress: false


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: 실행 모드 결정
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            case "$CRON" in
              "0 0,9 * * *"|"30 4 * * *") MODE=scan ;;    # 어떤 예약이 깨웠는지로 판정 — 실행 지연·inbox 겹침과 무관
              *)                          MODE=inbox ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "실행 모드: $MODE  (UTC $(date -u '+%H:%M') / KST $(date '+%H:%M'))"


      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - name: 패키지 설치
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "pw_version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"


      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.deps.outputs.pw_version }}-v2


      - name: Chromium 설치
        run: |
          # 캐시 히트여도 실행 파일이 실제로 있는지 확인 — 불완전하게 저장된 캐시(빈 폴더·구버전 셸)면 재설치
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ] \
             && ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome >/dev/null 2>&1 \
             && ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1; then
            echo "브라우저 캐시 정상 — 시스템 의존성만 설치"
            python -m playwright install-deps chromium
          else
            echo "브라우저 캐시 없음/불완전 — Chromium 재설치"
            python -m playwright install --with-deps chromium
          fi


      - name: 실행 (${{ steps.mode.outputs.mode }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ALERT_CHAT_IDS }}
          TELEGRAM_ADMIN_CHAT_IDS: ${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS }}
          SCRAPER_DEBUG_DIR: debug
        run: python main.py ${{ steps.mode.outputs.mode }}


      - name: 데이터 파일 커밋 · 푸시
        if: always()
        run: |
          git config user.name "festival-alert-bot"
          git config user.email "festival-alert-bot@users.noreply.github.com"
          for f in festival_sites.json known_posts.json feedback.json bot_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
            exit 0
          fi
          git commit -m "data: ${{ steps.mode.outputs.mode }} $(date '+%Y-%m-%d %H:%M KST') [skip ci]"
          for i in 1 2 3; do
            # 이전 시도에서 rebase 가 중단된 채 남아 있으면 정리 (unmerged files 로 pull 이 막히는 것 방지)
            git rebase --abort 2>/dev/null || true
            # 데이터 JSON 이 원격과 충돌하면 이번 실행 결과를 우선 (rebase 중이라 'theirs' 가 이번 커밋)
            if git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "push 실패 — 재시도 $i"
            sleep 10
          done
          exit 1


      - name: 디버그 스크린샷 업로드 (실패 사이트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
