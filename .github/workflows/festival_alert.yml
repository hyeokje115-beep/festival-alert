name: Festival Alert

on:
  schedule:
    - cron: "0 0,9 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python festival_checker.py

      - name: Commit updated known_posts.json
        run: |
          git config user.name "festival-bot"
          git config user.email "bot@example.com"
          git add known_posts.json
          git diff --staged --quiet || git commit -m "update known posts [skip ci]"
          git push
