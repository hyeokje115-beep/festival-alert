name: Festival Alert

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 오전 9시 KST (UTC 00:00)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python festival_checker.py

      - name: Commit updated known_festivals.json
        run: |
          git config user.name "festival-bot"
          git config user.email "bot@example.com"
          git add known_festivals.json
          git diff --staged --quiet || git commit -m "update known festivals [skip ci]"
          git push
