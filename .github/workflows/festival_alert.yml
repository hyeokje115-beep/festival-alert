name: Festival Alert
on:
  workflow_dispatch:
    inputs:
      mode:
        description: send, dry-run, status, resolve
        required: false
        default: send
      resolve_id:
        required: false
      resolution:
        required: false
      confirm:
        required: false
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
concurrency:
  group: festival-alert-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Install
        run: python -m pip install --requirement requirements.txt
      - name: Offline self-tests
        run: python festival_checker.py --self-test
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"
          if [ "$MODE" = "dry-run" ]; then
            python festival_checker.py --dry-run
          elif [ "$MODE" = "status" ]; then
            python festival_checker.py --mode status
          elif [ "$MODE" = "resolve" ]; then
            python festival_checker.py --mode resolve --resolve "${{ github.event.inputs.resolve_id }}" --resolution "${{ github.event.inputs.resolution }}" --confirm "${{ github.event.inputs.confirm }}"
          else
            python festival_checker.py --mode send
          fi
